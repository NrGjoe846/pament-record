      <stop offset="100%" stop-color="#C5BFEE"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EBD3A"/>
