<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E4FA"/>
      <stop offset="100%" stop-color="#C5BFEE"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EBD3A"/>
      <stop offset="100%" stop-color="#4B8624"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A2740" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#1C1C1E"/>
  
  <!-- Outer Lavender Card -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#lavenderGrad)" filter="url(#softShadow)"/>

  <!-- Inner Dark Screen / Accent -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="#1C1C1E"/>

  <!-- Card Design Element -->
  <rect x="136" y="144" width="240" height="148" rx="24" fill="url(#lavenderGrad)"/>
  
  <!-- Green Badge -->
  <rect x="256" y="260" width="104" height="48" rx="24" fill="url(#greenGrad)"/>
  <circle cx="280" cy="284" r="8" fill="#FFFFFF"/>
  <path d="M296 288 L304 278 L312 284 L328 268" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Rupee Symbol -->
  <text x="168" y="235" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#1C1C1E">₹</text>

  <!-- Mic Action Dot -->
  <circle cx="256" cy="356" r="32" fill="#2A2740"/>
  <path d="M256 342 C251 342 247 346 247 351 L247 359 C247 364 251 368 256 368 C261 368 265 364 265 359 L265 351 C265 346 261 342 256 342 Z M241 356 C241 364 247 371 256 371 C265 371 271 364 271 356 M256 371 L256 378 M250 378 L262 378" stroke="#D9D4F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

